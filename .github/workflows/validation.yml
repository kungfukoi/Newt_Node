name: NewtNode Validation
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:performance
      - run: npm run build
      - run: npm run smoke:isolated
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
