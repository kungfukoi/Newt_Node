name: NewtNode Validation
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # Use the Intel pool while hosted macOS ARM runners have capacity issues.
        os: [windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    # The macOS lane reached 30 minutes before the full Chromium suite finished.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Media tests launch FFmpeg subprocesses that also use multiple threads.
      - run: npm test -- --test-concurrency=2
      - run: npm run test:performance
      - run: npm run build
      - run: npm run smoke:isolated
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() && hashFiles('playwright-report/**', 'test-results/**') != '' }}
        with:
          name: browser-results-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
